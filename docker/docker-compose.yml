services:
  pulp:
    # Pinned so the acceptance tests, and the OpenAPI schema
    # TestFeatureSetsMatchAPISchema reads from this container, run against a
    # known Pulp rather than whatever "latest" happens to be. Dependabot
    # raises the bump; see .github/dependabot.yml.
    image: pulp/pulp:3.116.1
    container_name: pulp
    ports:
      - "8080:80"
    volumes:
      - ./settings:/etc/pulp
    devices:
      - /dev/fuse:/dev/fuse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/pulp/api/v3/status/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  reset-password:
    image: docker:cli
    depends_on:
      pulp:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: docker exec pulp pulpcore-manager reset-admin-password --password admin
    restart: "no"
