# Terraform Provider release workflow.
name: Release

# Builds and publishes a release when a "v*" tag is pushed. Cut the tag with
# `cz bump`, which derives the version from the Conventional Commits since the
# last one; see the README.
on:
  push:
    tags:
      - "v*"

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      # A tag on a branch is stranded the moment that branch is squashed or
      # rebased. cz then cannot see it, and reports a version that is already
      # taken, against a changelog range that reruns the last release. Catch
      # it here, where publishing would otherwise make it permanent.
      - name: Refuse a tag that is not on ${{ github.event.repository.default_branch }}
        run: |
          default='${{ github.event.repository.default_branch }}'
          git fetch --no-tags origin "$default"
          if ! git merge-base --is-ancestor HEAD "origin/$default"; then
            echo "::error::${GITHUB_REF_NAME} is not on $default, so it would be" \
                 "stranded as soon as its branch is merged. Release from $default:" \
                 "git switch $default && make release"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
