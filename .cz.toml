[tool.commitizen]
name = "cz_conventional_commits"
# A Go provider carries its version in nothing but its git tags: goreleaser
# stamps main.version from the tag it builds, so there is no file to keep in
# step and the tags are the single source of truth.
version_provider = "scm"
# Matches the tag pattern release.yml builds from and the Terraform Registry
# expects.
tag_format = "v$version"
# Lightweight tags are invisible to `git push --follow-tags`, which would
# leave a released version untagged on the remote.
annotated_tag = true
update_changelog_on_bump = true
# Keeps the entries already written instead of regenerating the whole file
# from history on every bump.
changelog_incremental = true
# The default "bump: ..." is not a Conventional Commits type, so it would fail
# the very check this repository enforces.
bump_message = "chore(release): $current_version → $new_version"
